name: CI

# Staged pipeline: each stage only runs once the cheaper stage before it has passed, so a
# broken unit test fails in ~2 minutes instead of after a full integration-test/image-build/
# scan run. `console` is guarded to skip cleanly (not fail) when console/ isn't present in a
# given checkout - it is developed in parallel and this workflow must not block on it existing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: build + the 71 fast, infra-free unit tests --------------------------------
  # See control-plane/README.md's "Testing" section: run state machine, IdempotencyGuard,
  # MapStruct mappers, Bean Validation, NoopJobLauncher's simulated lifecycle, and a full
  # @SpringBootTest context-load smoke test against in-memory H2 - no Docker involved.
  unit-tests:
    name: control-plane unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: control-plane/pom.xml

      - name: mvn clean verify
        working-directory: control-plane
        run: mvn -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-surefire-reports
          path: control-plane/target/surefire-reports
          retention-days: 7

  # --- Stage 2: Testcontainers-backed integration tests ------------------------------------
  # Real Postgres schema/repositories, real MongoDB aggregation pipeline - see
  # control-plane/README.md. Excluded from the default `mvn verify` run (surefire's
  # excludedGroups); this is the explicit opt-in. GitHub-hosted ubuntu runners ship Docker
  # already, which is all Testcontainers needs.
  integration-tests:
    name: control-plane integration tests (Testcontainers)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: control-plane/pom.xml

      - name: mvn verify -Pintegration
        working-directory: control-plane
        run: mvn -B verify -Pintegration

  # --- Stage 3: console build + vitest, guarded ---------------------------------------------
  # console/ is being built in parallel and this repository's root workflow must not fail (or
  # even be blocked on) it not existing yet in a given checkout.
  console:
    name: console build + vitest
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check console/ exists
        id: check
        run: |
          if [ -f console/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::console/package.json not found - skipping console build/test (it is developed in parallel and may not be present in every checkout)."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: npm ci
        if: steps.check.outputs.present == 'true'
        working-directory: console
        run: npm ci

      - name: npm run build
        if: steps.check.outputs.present == 'true'
        working-directory: console
        run: npm run build

      - name: vitest
        if: steps.check.outputs.present == 'true'
        working-directory: console
        run: npm run test -- --run

  # --- Stage 4: worker pytest ----------------------------------------------------------------
  # See worker/README.md - 40 hermetic tests, including real local mTLS handshakes generated
  # with the system `openssl` binary (no external network access needed).
  worker-tests:
    name: worker pytest
    needs: console
    # `console` can legitimately skip (see above) rather than fail - don't let that skip this
    # stage. Only a genuine failure/cancellation upstream should stop the pipeline here.
    if: |
      always() &&
      needs.console.result != 'failure' &&
      needs.console.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install and test
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -v

  # --- Stage 5: Trivy image scan, fail on HIGH/CRITICAL --------------------------------------
  image-scan:
    name: Trivy image scan
    needs: worker-tests
    if: |
      always() &&
      needs.worker-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane image
        run: docker build -t agentplane-control-plane:ci control-plane

      - name: Build worker image
        run: docker build -t agentplane-worker:ci worker

      - name: Trivy - control-plane
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: agentplane-control-plane:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy - worker
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: agentplane-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # --- Stage 6: helm lint ---------------------------------------------------------------------
  helm-lint:
    name: helm lint
    needs: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: helm lint
        run: helm lint charts/agentplane -f charts/agentplane/values.yaml -f charts/agentplane/values-dev.yaml

      - name: helm lint (prod overlay)
        run: helm lint charts/agentplane -f charts/agentplane/values.yaml -f charts/agentplane/values-prod.yaml

      - name: helm template (rendering sanity check)
        run: |
          helm template agentplane charts/agentplane \
            -f charts/agentplane/values.yaml -f charts/agentplane/values-dev.yaml > /dev/null
