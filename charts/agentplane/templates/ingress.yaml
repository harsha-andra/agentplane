{{- if .Values.controlPlane.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentplane.controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentplane.controlPlane.labels" . | nindent 4 }}
  {{- with .Values.controlPlane.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.controlPlane.ingress.className }}
  {{- if .Values.controlPlane.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.controlPlane.ingress.host }}
      secretName: {{ .Values.controlPlane.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.controlPlane.ingress.host }}
      http:
        paths:
          - path: {{ .Values.controlPlane.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentplane.controlPlane.fullname" . }}
                port:
                  number: {{ .Values.controlPlane.service.port }}
{{- end }}
