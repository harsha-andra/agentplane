{{- if .Values.serviceMonitor.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agentplane.controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentplane.controlPlane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "agentplane.controlPlane.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- else }}
{{/*
serviceMonitor.enabled=true but the monitoring.coreos.com/v1 ServiceMonitor CRD is not
registered against this target (this is also what `helm lint`/`helm template` see by default,
since neither talks to a live cluster unless given --api-versions) - skip rendering rather than
fail, so this chart still lints/templates/installs cleanly against a cluster with no Prometheus
Operator. Install kube-prometheus-stack (or any provider of that CRD) first, or explicitly set
serviceMonitor.enabled=false to make the "no metrics scraping configured" choice on purpose.
*/}}
{{- end }}
{{- end }}
