{{- if .Values.controlPlane.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentplane.controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentplane.controlPlane.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentplane.controlPlane.fullname" . }}
  minReplicas: {{ .Values.controlPlane.hpa.minReplicas }}
  maxReplicas: {{ .Values.controlPlane.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlPlane.hpa.targetCPUUtilizationPercentage }}
{{- end }}
