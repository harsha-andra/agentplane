spring:
  application:
    name: agentplane-control-plane

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentplane}
    username: ${SPRING_DATASOURCE_USERNAME:agentplane}
    password: ${SPRING_DATASOURCE_PASSWORD:agentplane}
    hikari:
      maximum-pool-size: 10
      pool-name: agentplane-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/agentplane}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# AGENTPLANE-specific configuration - see README.md "Configuration" table for the full list.
agentplane:
  k8s:
    # No Kubernetes cluster is required to run this application - see orchestration.NoopJobLauncher.
    # Set to true (with a reachable cluster / kubeconfig) to switch to orchestration.Fabric8JobLauncher.
    enabled: ${AGENTPLANE_K8S_ENABLED:false}
    pod-watch-interval-ms: 5000
  stream:
    enabled: true
    stream-key: agentplane:runs
    consumer-group: agentplane-workers
    poll-timeout-ms: 2000
    poll-batch-size: 10
    visibility-timeout-ms: 60000
    idempotency-ttl-seconds: 3600
  mongo:
    ensure-indexes-on-startup: true
  sse:
    heartbeat-interval-ms: 15000

logging:
  level:
    com.harshaandra.agentplane: INFO
